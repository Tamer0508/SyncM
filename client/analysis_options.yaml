# Конфигурация анализатора. Проверяется командой `flutter analyze`.
#
# ПРИНЦИП: на существующем коде включаем только правила, которые ловят
# настоящие дефекты. Стилевые правила (кавычки, висячие запятые, порядок
# импортов) сознательно не включены: они подсветили бы каждый файл, и за
# этим шумом реальные проблемы стали бы невидимы. Их можно добавить позже,
# когда код будет приведён в порядок — список внизу файла.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

  errors:
    # Обращение к BuildContext после await — источник падений и утечек.
    # Пока warning, а не error: такие места в коде есть, и сборку из-за них
    # ронять не нужно. Поднять до error имеет смысл после того, как разберём.
    use_build_context_synchronously: warning

    # Устаревшие API: withOpacity, MaterialStateProperty, ColorScheme.background
    # и другие. Не ошибка, но при обновлении Flutter станет ею — держим на виду.
    deprecated_member_use: info

linter:
  rules:
    # --- Ловят реальные ошибки ---

    # Пустой catch проглатывает ошибку целиком. В проекте встречается
    # `catch (_) {}` — там ошибки исчезают бесследно.
    empty_catches: true

    # Незакрытые StreamController: в SocketService их два, и они не
    # закрываются никогда.
    close_sinks: true

    # Незакрытые подписки на стримы — та же природа утечки.
    cancel_subscriptions: true

    # Забытый await у Future: молча теряется и ошибка, и порядок выполнения.
    unawaited_futures: true

    avoid_empty_else: true
    unnecessary_statements: true
    no_duplicate_case_values: true
    valid_regexps: true

    # --- Flutter-специфичное, с практическим эффектом ---
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    avoid_unnecessary_containers: true

# ─────────────────────────────────────────────────────────────────────────
# Включить позже, когда основной код будет приведён в порядок.
# Добавлять по одному правилу за раз и сразу исправлять — иначе снова
# получится стена предупреждений, в которой ничего не разглядеть.
#
#     avoid_print: true              # print() в socket_service, google_sign
#     prefer_const_constructors: true
#     prefer_final_locals: true
#     prefer_single_quotes: true
#     directives_ordering: true
#     require_trailing_commas: true
#     sort_child_properties_last: true
#     curly_braces_in_flow_control_structures: true
#
# Также сознательно не включены strict-casts и strict-raw-types: на коде,
# где много Map<String, dynamic> из JSON, они дают сотни срабатываний.
# ─────────────────────────────────────────────────────────────────────────