name: syncm
description: Flutter client for SyncM app
publish_to: 'none'

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  provider: ^6.1.5+1
  socket_io_client: ^2.0.3+1
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  spotify_sdk: ^3.0.0
  image_picker: ^1.0.7
  palette_generator: ^0.3.3+2
  uuid: ^4.5.3
  rxdart: ^0.27.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  flutter_foreground_task: ^8.10.0
  wakelock_plus: ^1.2.5
  crop_image: ^1.0.17
  image: ^4.8.0
  flutter_cache_manager: ^3.4.1
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/legal/