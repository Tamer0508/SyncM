name: syncm
description: Flutter client for SyncM app
publish_to: 'none'

environment:
  sdk: '>=2.18.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  socket_io_client: ^2.0.3+1
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  spotify_sdk: ^3.0.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  web: ^0.5.1

flutter:
  uses-material-design: true